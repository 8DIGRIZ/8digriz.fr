<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8DIGRIZ — Développement et édition d'applications et de logiciels</title>
<meta name="description" content="8DIGRIZ conçoit, développe et édite des applications web et mobiles ainsi que des logiciels sur mesure.">
<link rel="canonical" href="https://8digriz.fr/">
<meta name="theme-color" content="#080907">
<meta property="og:type" content="website">
<meta property="og:site_name" content="8DIGRIZ">
<meta property="og:title" content="8DIGRIZ — Développement et édition d'applications et de logiciels">
<meta property="og:description" content="Conception, développement et édition d'applications web et mobiles et de logiciels sur mesure.">
<meta property="og:url" content="https://8digriz.fr/">
<meta property="og:locale" content="fr_FR">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/bricolage-grotesque-700-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/spectral-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Bricolage Grotesque";
  font-style: normal;
  font-weight: 700 800;
  font-display: swap;
  src: url("/assets/fonts/bricolage-grotesque-700-800.woff2") format("woff2");
}
@font-face {
  font-family: "IBM Plex Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/assets/fonts/ibm-plex-mono-400.woff2") format("woff2");
}
@font-face {
  font-family: "Spectral";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/assets/fonts/spectral-400.woff2") format("woff2");
}

:root {
  --bg: #080907;
  --ink: #f4f0e6;
  --muted: #a29d91;
  --faint: #5e6156;
  --line: #25271f;
  --accent: #f05a32;
  --display: "Bricolage Grotesque", ui-sans-serif, sans-serif;
  --body: "Spectral", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --pad: clamp(1.25rem, 4vw, 4.5rem);
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  background:
    linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(244,240,230,.08) calc(100% - 1px)) 0 0 / 25% 100%,
    var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}

a:hover { color: var(--accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: var(--pad);
}

.top,
.bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.brand { color: var(--ink); }

nav,
.links {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: .9rem 1.4rem;
  color: var(--muted);
}

.hero {
  display: grid;
  align-content: end;
  gap: clamp(2rem, 6vw, 4.5rem);
  padding-block: clamp(5rem, 16vh, 9rem) clamp(3rem, 8vh, 6rem);
}

.name {
  margin: 0;
  max-width: 9ch;
  font-family: var(--display);
  font-size: clamp(5rem, 22vw, 19rem);
  font-weight: 800;
  line-height: .76;
  letter-spacing: 0;
}

.name span { color: var(--accent); }

.statement {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(14rem, .7fr);
  gap: clamp(2rem, 8vw, 8rem);
  align-items: end;
  border-top: 1px solid var(--line);
  padding-top: clamp(1.5rem, 3vw, 2.5rem);
}

.lede {
  margin: 0;
  max-width: 25ch;
  font-size: clamp(1.55rem, 3.2vw, 3rem);
  line-height: 1.02;
  text-wrap: balance;
}

.meta {
  display: grid;
  gap: .85rem;
  color: var(--muted);
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.meta p {
  margin: 0;
  padding-top: .85rem;
  border-top: 1px solid var(--line);
}

.bottom { color: var(--faint); }

@media (max-width: 46rem) {
  body { background-size: 50% 100%; }

  .page { padding: 1.2rem; }

  .top,
  .bottom {
    align-items: flex-start;
    flex-direction: column;
  }

  nav,
  .links { justify-content: flex-start; }

  .hero { align-content: center; }

  .statement { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="/">8DIGRIZ</a>
    <nav aria-label="Navigation principale">
      <a href="/mentions-legales.html">Mentions légales</a>
      <a href="/confidentialite.html">Confidentialité</a>
      <a href="mailto:contact@8digriz.fr">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1 class="name">8DIGRIZ<span>.</span></h1>
    <section class="statement" aria-label="Présentation">
      <p class="lede">Applications web ou mobiles sur mesure.</p>
      <div class="meta">
        <p>Conception</p>
        <p>Développement</p>
        <p>Édition</p>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <p>© 8DIGRIZ — SASU</p>
    <div class="links">
      <a href="mailto:contact@8digriz.fr">contact@8digriz.fr</a>
    </div>
  </footer>
</div>
</body>
</html>
